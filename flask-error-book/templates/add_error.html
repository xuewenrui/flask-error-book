<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加错题 - AI 智能错题本</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container" style="max-width:700px;">
        <div style="margin-bottom:24px;">
            <a href="{{ url_for('error_book.error_book') }}" style="color:var(--text-secondary);text-decoration:none;font-size:14px;">← 返回错题本</a>
            <h1 style="font-size:24px;margin-top:8px;">✏️ 添加错题</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card">
            <form method="POST" action="{{ url_for('error_book.add_error') }}">
                <div class="form-group">
                    <label>学科 <span style="color:red;">*</span></label>
                    <select name="subject_id" required>
                        <option value="">-- 选择学科 --</option>
                        {% for s in subjects %}
                        <option value="{{ s.id }}">{{ s.icon }} {{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>题目内容 <span style="color:red;">*</span></label>
                    <textarea name="question_text" rows="4" placeholder="请输入题目的完整内容..." required></textarea>
                </div>

                <div class="form-group">
                    <label>选项设置 <span class="hint">（选择题请填写选项）</span></label>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>A 选项</label>
                        <input type="text" name="option_a" placeholder="选项A内容">
                    </div>
                    <div class="form-group">
                        <label>B 选项</label>
                        <input type="text" name="option_b" placeholder="选项B内容">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>C 选项</label>
                        <input type="text" name="option_c" placeholder="选项C内容">
                    </div>
                    <div class="form-group">
                        <label>D 选项</label>
                        <input type="text" name="option_d" placeholder="选项D内容">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>正确答案 <span style="color:red;">*</span></label>
                        <select name="correct_answer" required>
                            <option value="">-- 选择 --</option>
                            <option value="A">A</option><option value="B">B</option>
                            <option value="C">C</option><option value="D">D</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>你选的答案</label>
                        <select name="user_answer">
                            <option value="">-- 未选择 --</option>
                            <option value="A">A</option><option value="B">B</option>
                            <option value="C">C</option><option value="D">D</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>题目解析</label>
                    <textarea name="explanation" rows="3" placeholder="这道题的解题思路或知识点解析..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>知识点标签 <span class="hint">（逗号分隔）</span></label>
                        <input type="text" name="knowledge_tags" placeholder="例如：二次函数, 配方法, 不等式">
                    </div>
                    <div class="form-group">
                        <label>难度</label>
                        <select name="difficulty">
                            <option value="1">★ 非常简单</option>
                            <option value="2">★★ 较简单</option>
                            <option value="3" selected>★★★ 中等</option>
                            <option value="4">★★★★ 较难</option>
                            <option value="5">★★★★★ 很难</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex;gap:12px;margin-top:8px;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">保存错题</button>
                    <a href="{{ url_for('error_book.error_book') }}" class="btn btn-outline">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script>
    document.querySelector('.menu-toggle')?.addEventListener('click', function() {
        document.querySelector('.nav-links').classList.toggle('open');
    });
    </script>
</body>
</html>
