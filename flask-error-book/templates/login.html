<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能错题本 - 首页</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo">📝</div>
            <h1>AI 智能错题本</h1>
            <p class="subtitle">登录您的账户，继续学习之旅</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" required autofocus>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:8px;font-size:14px;">
                    <input type="checkbox" name="remember" id="remember" style="width:auto;">
                    <label for="remember" style="margin:0;font-weight:400;">记住我</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </form>

            <div class="auth-footer">
                还没有账户？<a href="{{ url_for('register') }}">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
